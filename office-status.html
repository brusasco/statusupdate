<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        /* CHANGE THE COLOR HERE (e.g., #007aff for blue, #34c759 for green, #ff9500 for orange) */
        :root { --bg-color: #34c759; } 

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica; 
            background-color: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; color: white; overflow: hidden;
        }
        .alert-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px 20px;
            border-radius: 30px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 10px; }
        
        /* THE MAIN STATUS TEXT */
        .status { font-size: 2.2rem; font-weight: 800; line-height: 1.1; margin: 20px 0; }
        
        .time { font-size: 0.9rem; opacity: 0.7; font-weight: 500; }
    </style>
</head>
<body>
    <div class="alert-card">
        <h1>Current Status</h1>
        <div class="status">I am at CBC</div>
        <div class="time">Last Updated: Jan 9, 2026 at 9:10 AM</div>
    </div>
</body>
</html>
